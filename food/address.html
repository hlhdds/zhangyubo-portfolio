<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收货地址 - 美味点餐</title>
<style>
    :root {
        --primary: #ff6a00;
        --primary-light: #ff9448;
        --accent: #ff4500;
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #2c2c2c;
        --text-sub: #8a8f99;
        --text-light: #b8bcc4;
        --border: #f0f1f3;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.03);
        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        max-width: 640px;
        margin: 0 auto;
        min-height: 100vh;
        padding-bottom: 90px;
    }
    .header {
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        color: #fff;
        padding: 18px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: 0 4px 16px rgba(255,106,0,.25);
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .back { color: #fff; text-decoration: none; font-size: 14px; opacity: .92; }
    main { padding: 14px; }
    .empty { text-align: center; color: var(--text-light); padding: 80px 0; font-size: 14px; }
    .empty::before { content: '📍'; display: block; font-size: 48px; margin-bottom: 14px; opacity: .45; }

    .addr-card {
        background: var(--card);
        border-radius: var(--radius-md);
        padding: 15px 17px;
        margin-bottom: 13px;
        box-shadow: var(--shadow-sm);
        animation: fadeUp .35s ease both;
        transition: box-shadow .2s;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .addr-card:nth-child(1){animation-delay:.03s}
    .addr-card:nth-child(2){animation-delay:.06s}
    .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .name { font-size: 16px; font-weight: 700; }
    .phone { font-size: 14px; color: var(--text-sub); }
    .tag {
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 5px;
        background: #f2f3f5;
        color: var(--text-sub);
    }
    .default-badge {
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 5px;
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        color: #fff;
        font-weight: 600;
    }
    .addr-text { font-size: 14px; color: #555; margin-top: 9px; line-height: 1.55; }
    .row2 {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 13px;
        padding-top: 13px;
        border-top: 1px dashed #eee;
        font-size: 13px;
        color: var(--text-sub);
    }
    .row2 .set-default { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .row2 .set-default input { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }
    .row2 .spacer { flex: 1; }
    .row2 button {
        border: none;
        background: none;
        font-size: 13px;
        cursor: pointer;
        color: var(--text-sub);
        padding: 2px 6px;
        transition: color .15s;
    }
    .row2 button:active { opacity: .6; }
    .row2 .del { color: #f44336; }

    .bottom-bar {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        max-width: 640px;
        margin: 0 auto;
        height: 64px;
        background: #fff;
        display: flex;
        align-items: center;
        padding: 0 14px;
        z-index: 30;
        box-shadow: 0 -4px 16px rgba(0,0,0,.08);
    }
    #addBtn {
        flex: 1;
        height: 46px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(255,106,0,.35);
        transition: transform .1s;
    }
    #addBtn:active { transform: scale(.97); }

    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .5);
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s;
        z-index: 40;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .sheet {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        max-width: 640px;
        margin: 0 auto;
        background: #fff;
        border-radius: 20px 20px 0 0;
        max-height: 90vh;
        overflow-y: auto;
        transform: translateY(105%);
        transition: transform .3s cubic-bezier(.32,.72,0,1);
        z-index: 41;
        padding-bottom: 16px;
        box-shadow: 0 -8px 30px rgba(0,0,0,.15);
    }
    .sheet.show { transform: translateY(0); }
    .sheet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: #fff;
        border-radius: 20px 20px 0 0;
    }
    .sheet-header h2 { font-size: 16px; font-weight: 700; }
    .sheet-header button { border: none; background: none; font-size: 14px; cursor: pointer; color: var(--text-sub); }

    .form { padding: 10px 18px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 7px; font-weight: 500; }
    .field input, .field textarea, .field select {
        width: 100%;
        border: 1.5px solid #eceef1;
        border-radius: var(--radius-sm);
        padding: 11px 12px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        background: #fafbfc;
        transition: border-color .15s, background .15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary-light); background: #fff; }
    .field textarea { height: 72px; resize: none; }
    .region-row { display: flex; gap: 8px; }
    .region-row select { flex: 1; }
    .tags { display: flex; gap: 8px; }
    .tags label { flex: 1; cursor: pointer; }
    .tags input { display: none; }
    .tags span {
        display: block;
        text-align: center;
        padding: 9px 0;
        border: 1.5px solid #e8e9ec;
        border-radius: var(--radius-sm);
        font-size: 13px;
        color: var(--text-sub);
        transition: all .15s;
    }
    .tags input:checked + span { border-color: var(--primary); color: var(--primary); background: #fff7f2; font-weight: 600; }
    .default-switch { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #444; }
    .default-switch input { width: auto; accent-color: var(--primary); width: 18px; height: 18px; }
    #saveBtn {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 8px;
        box-shadow: 0 3px 10px rgba(255,106,0,.35);
        transition: transform .1s;
    }
    #saveBtn:active { transform: scale(.97); }

    .toast {
        position: fixed;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, .78);
        color: #fff;
        padding: 13px 24px;
        border-radius: 12px;
        font-size: 14px;
        z-index: 60;
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s;
        backdrop-filter: blur(4px);
    }
    .toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="header">
    <a class="back" href="index.html">‹ 返回</a>
    <h1>收货地址</h1>
</header>

<main id="list"></main>

<div class="bottom-bar">
    <button id="addBtn">+ 新增收货地址</button>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
    <div class="sheet-header">
        <h2 id="sheetTitle">新增地址</h2>
        <button id="closeBtn">取消</button>
    </div>
    <div class="form">
        <div class="field">
            <label>收货人</label>
            <input id="fName" maxlength="20" placeholder="请输入收货人姓名">
        </div>
        <div class="field">
            <label>手机号</label>
            <input id="fPhone" maxlength="11" inputmode="numeric" placeholder="请输入 11 位手机号">
        </div>
        <div class="field">
            <label>省市区</label>
            <div class="region-row">
                <select id="fProvince"></select>
                <select id="fCity"></select>
                <select id="fDistrict"></select>
            </div>
        </div>
        <div class="field">
            <label>详细地址</label>
            <textarea id="fDetail" maxlength="100" placeholder="街道、门牌号、楼层等"></textarea>
        </div>
        <div class="field">
            <label>标签</label>
            <div class="tags">
                <label><input type="radio" name="tag" value="家" checked><span>家</span></label>
                <label><input type="radio" name="tag" value="公司"><span>公司</span></label>
                <label><input type="radio" name="tag" value="学校"><span>学校</span></label>
                <label><input type="radio" name="tag" value="其他"><span>其他</span></label>
            </div>
        </div>
        <div class="field default-switch">
            <span>设为默认地址</span>
            <input type="checkbox" id="fDefault">
        </div>
        <button id="saveBtn">保存</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * 外卖收货地址模块 MVP
 * localStorage key: foodAddressesV1
 *   [{ id, name, phone, province, city, district, detail, tag, isDefault }]
 * 规则: 至多一个默认地址; 删除默认地址后自动把第一条设为默认
 * ============================================================ */
const ADDR_KEY = 'foodAddressesV1';
const $ = id => document.getElementById(id);

/* 省市区数据(MVP 内置常用城市) */
const REGION = {
    '北京市': { '北京市': ['东城区', '西城区', '朝阳区', '海淀区', '丰台区'] },
    '上海市': { '上海市': ['黄浦区', '徐汇区', '静安区', '浦东新区', '长宁区'] },
    '广东省': {
        '广州市': ['天河区', '越秀区', '海珠区', '白云区', '番禺区'],
        '深圳市': ['南山区', '福田区', '罗湖区', '宝安区', '龙岗区']
    },
    '浙江省': {
        '杭州市': ['西湖区', '上城区', '拱墅区', '滨江区', '余杭区'],
        '宁波市': ['海曙区', '江北区', '鄞州区']
    },
    '江苏省': {
        '南京市': ['玄武区', '秦淮区', '鼓楼区', '建邺区', '江宁区'],
        '苏州市': ['姑苏区', '工业园区', '吴中区', '相城区']
    },
    '四川省': { '成都市': ['锦江区', '武侯区', '青羊区', '成华区', '高新区'] },
    '湖北省': { '武汉市': ['江岸区', '江汉区', '武昌区', '洪山区', '汉阳区'] },
    '陕西省': { '西安市': ['雁塔区', '碑林区', '莲湖区', '未央区', '新城区'] },
    '重庆市': { '重庆市': ['渝中区', '江北区', '南岸区', '沙坪坝区', '九龙坡区'] },
    '湖南省': { '长沙市': ['岳麓区', '芙蓉区', '天心区', '雨花区', '开福区'] }
};

let addresses = [];
let editingId = null;

/* ---------- 存取 ---------- */
function load() {
    try {
        const a = JSON.parse(localStorage.getItem(ADDR_KEY));
        return Array.isArray(a) ? a : [];
    } catch { return []; }
}
function save() {
    localStorage.setItem(ADDR_KEY, JSON.stringify(addresses));
}

function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- 渲染 ---------- */
function render() {
    const list = $('list');
    if (addresses.length === 0) {
        list.innerHTML = '<div class="empty">还没有收货地址,点击下方按钮新增</div>';
        return;
    }
    // 默认地址排最前
    const sorted = [...addresses].sort((a, b) => (b.isDefault ? 1 : 0) - (a.isDefault ? 1 : 0));
    list.innerHTML = sorted.map(a => `
        <div class="addr-card">
            <div class="row1">
                <span class="name">${a.name}</span>
                <span class="phone">${a.phone}</span>
                <span class="tag">${a.tag}</span>
                ${a.isDefault ? '<span class="default-badge">默认</span>' : ''}
            </div>
            <div class="addr-text">${a.province} ${a.city} ${a.district} ${a.detail}</div>
            <div class="row2">
                <label class="set-default">
                    <input type="radio" name="default" ${a.isDefault ? 'checked' : ''}
                        onchange="setDefault(${a.id})">设为默认
                </label>
                <span class="spacer"></span>
                <button onclick="edit(${a.id})">编辑</button>
                <button class="del" onclick="remove(${a.id})">删除</button>
            </div>
        </div>`).join('');
}

/* ---------- 操作 ---------- */
function setDefault(id) {
    addresses.forEach(a => a.isDefault = (a.id === id));
    save();
    render();
    toast('已设为默认地址');
}

function remove(id) {
    if (!confirm('确定删除该地址吗?')) return;
    const wasDefault = addresses.find(a => a.id === id)?.isDefault;
    addresses = addresses.filter(a => a.id !== id);
    if (wasDefault && addresses.length) addresses[0].isDefault = true;
    save();
    render();
    toast('已删除');
}

/* 省份/城市/区联动 */
function fillProvinces(selected) {
    const provs = Object.keys(REGION);
    $('fProvince').innerHTML = provs.map(p =>
        `<option ${p === selected ? 'selected' : ''}>${p}</option>`).join('');
}
function fillCities(selected) {
    const prov = $('fProvince').value;
    const cities = Object.keys(REGION[prov] || {});
    $('fCity').innerHTML = cities.map(c =>
        `<option ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
}
function fillDistricts(selected) {
    const prov = $('fProvince').value, city = $('fCity').value;
    const districts = (REGION[prov] || {})[city] || [];
    $('fDistrict').innerHTML = districts.map(d =>
        `<option ${d === selected ? 'selected' : ''}>${d}</option>`).join('');
}

function openSheet(addr) {
    editingId = addr ? addr.id : null;
    $('sheetTitle').textContent = addr ? '编辑地址' : '新增地址';
    $('fName').value = addr ? addr.name : '';
    $('fPhone').value = addr ? addr.phone : '';
    fillProvinces(addr ? addr.province : Object.keys(REGION)[0]);
    fillCities(addr ? addr.city : undefined);
    fillDistricts(addr ? addr.district : undefined);
    $('fDetail').value = addr ? addr.detail : '';
    document.querySelectorAll('input[name="tag"]').forEach(r => {
        r.checked = addr ? r.value === addr.tag : r.value === '家';
    });
    $('fDefault').checked = addr ? !!addr.isDefault : addresses.length === 0; // 首个地址默认设为默认
    $('sheet').classList.add('show');
    $('overlay').classList.add('show');
}

function closeSheet() {
    $('sheet').classList.remove('show');
    $('overlay').classList.remove('show');
}

function edit(id) {
    const a = addresses.find(x => x.id === id);
    if (a) openSheet(a);
}

/* 保存(新增 / 编辑) */
function saveAddress() {
    const name = $('fName').value.trim();
    const phone = $('fPhone').value.trim();
    const detail = $('fDetail').value.trim();
    const province = $('fProvince').value;
    const city = $('fCity').value;
    const district = $('fDistrict').value;
    const tag = document.querySelector('input[name="tag"]:checked').value;
    const isDefault = $('fDefault').checked;

    if (!name) return toast('请填写收货人');
    if (!/^1[3-9]\d{9}$/.test(phone)) return toast('请填写正确的 11 位手机号');   // 简单格式校验
    if (!detail) return toast('请填写详细地址');

    const data = { name, phone, province, city, district, detail, tag, isDefault };

    if (editingId == null) {
        const id = addresses.reduce((m, a) => Math.max(m, a.id), 0) + 1;
        addresses.push({ id, ...data });
    } else {
        Object.assign(addresses.find(a => a.id === editingId), data);
    }
    // 保证默认地址唯一
    if (isDefault) {
        const keepId = editingId == null ? addresses[addresses.length - 1].id : editingId;
        addresses.forEach(a => a.isDefault = (a.id === keepId));
    }
    if (!addresses.some(a => a.isDefault) && addresses.length) addresses[0].isDefault = true;

    save();
    render();
    closeSheet();
    toast(editingId == null ? '地址已添加' : '地址已保存');
}

/* ---------- 事件 ---------- */
$('addBtn').addEventListener('click', () => openSheet(null));
$('closeBtn').addEventListener('click', closeSheet);
$('overlay').addEventListener('click', closeSheet);
$('saveBtn').addEventListener('click', saveAddress);
$('fProvince').addEventListener('change', () => { fillCities(); fillDistricts(); });
$('fCity').addEventListener('change', () => fillDistricts());

/* ---------- 初始化 ---------- */
addresses = load();
render();
</script>
</body>
</html>
