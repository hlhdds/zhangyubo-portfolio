<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张宇博 · Digital Creator</title>
<meta name="description" content="张宇博 — 武汉理工大学数字经济专业学生，独立开发者。中心枢纽式作品集。">
<style>
/* ============================================================
   张宇博 个人主页 v4 —— 中心枢纽节点式交互布局
   亮色科技风 · 单屏无滚动 · 中心品牌核 + 4 个悬浮节点 + 点击弹层
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #f6f8fc;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                 "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #0f172a;
}

/* 背景: 径向光斑 + 网格 + 扫描线 */
body::before {
    content: ""; position: fixed; inset: 0; z-index: 0;
    background:
        radial-gradient(ellipse 70% 60% at 15% 10%, rgba(0,122,255,.09) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 85% 15%, rgba(138,43,226,.08) 0%, transparent 55%),
        radial-gradient(ellipse 80% 70% at 50% 100%, rgba(255,107,53,.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 20% 85%, rgba(0,255,163,.06) 0%, transparent 50%);
    pointer-events: none;
}
body::after {
    content: ""; position: fixed; inset: 0; z-index: 0;
    background-image:
        linear-gradient(rgba(15,23,42,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15,23,42,.04) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(circle 60% at 50% 50%, #000 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(circle 60% at 50% 50%, #000 40%, transparent 90%);
    pointer-events: none;
}

/* 调色板 */
:root {
    --blue: #0078ff;
    --blue-soft: #e8f2ff;
    --blue-glow: 0 0 22px rgba(0,120,255,.35), 0 0 48px rgba(0,120,255,.18);
    --purple: #8a2be2;
    --purple-soft: #f3e8ff;
    --purple-glow: 0 0 22px rgba(138,43,226,.35), 0 0 48px rgba(138,43,226,.18);
    --orange: #ff6b35;
    --orange-soft: #fff0e8;
    --orange-glow: 0 0 22px rgba(255,107,53,.35), 0 0 48px rgba(255,107,53,.18);
    --green: #00d68f;
    --green-soft: #e6faf1;
    --green-glow: 0 0 22px rgba(0,214,143,.35), 0 0 48px rgba(0,214,143,.18);
    --bg: #f6f8fc;
    --text: #0f172a;
    --text-dim: #475569;
    --text-muted: #94a3b8;
    --card: rgba(255,255,255,.75);
    --card-solid: #ffffff;
    --border: rgba(15,23,42,.08);
}

/* ============================================================
   导航 —— 极简左上角 logo + 右上角状态
   ============================================================ */
.topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 20px 28px;
    display: flex; justify-content: space-between; align-items: center;
}
.brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 15px; letter-spacing: .04em;
}
.brand .core-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--blue);
    box-shadow: var(--blue-glow);
    animation: corePulse 2.4s ease-in-out infinite;
}
@keyframes corePulse {
    0%,100% { box-shadow: var(--blue-glow); transform: scale(1); }
    50% { box-shadow: 0 0 30px rgba(0,120,255,.6), 0 0 60px rgba(0,120,255,.3); transform: scale(1.15); }
}
.status {
    font-size: 12px; color: var(--text-muted); letter-spacing: .12em;
    display: flex; align-items: center; gap: 8px;
}
.status::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px rgba(0,214,143,.7);
}

/* ============================================================
   中心枢纽布局
   ============================================================ */
.stage {
    position: fixed; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
}

/* 连接 SVG */
.orbit-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
}
.orbit-svg path {
    fill: none;
    stroke: rgba(15,23,42,.1);
    stroke-width: 1.2;
    stroke-dasharray: 4 6;
}
/* 流动粒子 */
.orbit-svg circle.pulse {
    fill: var(--blue);
    filter: drop-shadow(0 0 4px rgba(0,120,255,.8));
}

/* 中心核 */
.core {
    position: relative;
    width: clamp(180px, 26vw, 260px);
    aspect-ratio: 1/1;
    border-radius: 50%;
    background:
        radial-gradient(circle at 30% 30%, #fff, #f0f4ff 60%, #e0e8ff);
    border: 1.5px solid rgba(0,120,255,.2);
    box-shadow:
        0 0 0 1px rgba(0,120,255,.08),
        0 20px 60px -20px rgba(0,120,255,.3),
        inset 0 0 40px rgba(255,255,255,.8);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s;
    z-index: 5;
}
.core:hover {
    transform: scale(1.04);
    box-shadow:
        0 0 0 2px rgba(0,120,255,.25),
        0 30px 80px -20px rgba(0,120,255,.4),
        inset 0 0 60px rgba(255,255,255,.9);
}
.core::before {
    content: "";
    position: absolute; inset: -18px;
    border-radius: 50%;
    border: 1px dashed rgba(0,120,255,.2);
    animation: spin 30s linear infinite;
}
.core::after {
    content: "";
    position: absolute; inset: -34px;
    border-radius: 50%;
    border: 1px dashed rgba(138,43,226,.15);
    animation: spin 45s linear infinite reverse;
}
@keyframes spin { to { transform: rotate(360deg); } }

.core .c-eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: .3em;
    color: var(--blue); text-transform: uppercase;
    margin-bottom: 10px;
}
.core .c-name {
    font-size: clamp(26px, 4vw, 38px);
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #0f172a 20%, var(--blue) 60%, var(--purple));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    line-height: 1;
}
.core .c-sub {
    font-size: 11px; color: var(--text-muted);
    margin-top: 12px; letter-spacing: .08em;
}

/* 节点 */
.node {
    position: absolute;
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
    cursor: pointer;
    user-select: none;
    z-index: 4;
    transition: transform .3s cubic-bezier(.2,.8,.2,1);
}
.node:hover { transform: translateY(-4px); }

.node-dot {
    width: clamp(52px, 7vw, 72px);
    aspect-ratio: 1/1;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(20px, 2.6vw, 28px);
    background: #fff;
    border: 1.5px solid rgba(15,23,42,.08);
    box-shadow:
        0 6px 20px -10px rgba(15,23,42,.2),
        inset 0 1px 0 rgba(255,255,255,1);
    transition: transform .3s, box-shadow .3s, border-color .3s;
    position: relative;
}
.node-dot::before {
    content: "";
    position: absolute; inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, currentColor 0%, transparent 70%);
    opacity: 0;
    transition: opacity .3s;
    filter: blur(12px);
    z-index: -1;
}
.node:hover .node-dot::before { opacity: .4; }
.node:hover .node-dot {
    transform: scale(1.12);
    border-color: currentColor;
}
.node:hover .node-label { color: currentColor; transform: translateY(-1px); }

.node-label {
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    color: var(--text-dim);
    padding: 4px 12px;
    background: #fff;
    border: 1px solid rgba(15,23,42,.06);
    border-radius: 999px;
    transition: color .3s, transform .3s, border-color .3s;
    white-space: nowrap;
}

/* 四个节点的颜色 & 位置(桌面端) */
.node--works  { color: var(--orange); top: 10%;  right: 8%; }
.node--skills { color: var(--blue);   bottom: 14%; right: 12%; }
.node--about  { color: var(--green);  bottom: 14%; left: 12%; }
.node--contact{ color: var(--purple); top: 10%;  left: 8%; }

/* 节点定位数学: 围绕中心,距离中心核 radius */
/* 中心核在 (50%,50%), 节点沿 45° / 135° / 225° / 315° 方向 */
/* 但上面已经写死了 top/left/right, 足够; 另外用 transform 微调对齐核中心 */

/* ============================================================
   详情弹层
   ============================================================ */
.modal-backdrop {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(15,23,42,.3);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden;
    transition: opacity .35s, visibility 0s linear .35s;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
}
.modal-backdrop.is-open {
    opacity: 1; visibility: visible;
    transition: opacity .35s, visibility 0s;
}

.modal {
    position: relative;
    width: min(560px, 92vw);
    max-height: min(560px, 80vh);
    overflow: hidden;
    background: #fff;
    border-radius: 20px;
    border: 1px solid rgba(15,23,42,.08);
    box-shadow:
        0 40px 80px -20px rgba(15,23,42,.25),
        0 0 0 1px rgba(255,255,255,.8) inset;
    transform: translateY(20px) scale(.96);
    opacity: 0;
    transition: transform .4s cubic-bezier(.16,1,.3,1), opacity .3s;
    display: flex; flex-direction: column;
}
.modal-backdrop.is-open .modal {
    transform: translateY(0) scale(1); opacity: 1;
}

.modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 24px 16px;
    border-bottom: 1px solid rgba(15,23,42,.06);
}
.modal-title {
    display: flex; align-items: center; gap: 12px;
    font-size: 18px; font-weight: 800;
    letter-spacing: -0.01em;
}
.modal-title .m-icon {
    width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
}
.modal-close {
    width: 32px; height: 32px; border-radius: 10px;
    border: none; background: rgba(15,23,42,.05);
    color: var(--text-muted);
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s, transform .2s;
}
.modal-close:hover { background: rgba(15,23,42,.1); color: var(--text); transform: rotate(90deg); }

.modal-body {
    padding: 20px 24px 24px;
    overflow-y: auto;
    flex: 1;
    font-size: 14px; line-height: 1.7;
    color: var(--text-dim);
}

/* Works 列表 */
.work-list { display: flex; flex-direction: column; gap: 12px; }
.work-item {
    display: flex; gap: 14px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(15,23,42,.03);
    border: 1px solid rgba(15,23,42,.05);
    text-decoration: none; color: inherit;
    transition: transform .2s, border-color .2s, box-shadow .2s;
}
.work-item:hover {
    transform: translateY(-2px);
    border-color: currentColor;
    box-shadow: 0 10px 30px -12px rgba(0,0,0,.15);
}
.work-item .w-emoji {
    width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
}
.work-item .w-body { flex: 1; }
.work-item .w-name { font-weight: 700; color: var(--text); }
.work-item .w-desc { font-size: 12.5px; margin-top: 4px; color: var(--text-dim); line-height: 1.5; }
.work-item .w-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

/* Skills 网格 */
.skill-grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
}
.skill-chip {
    padding: 12px;
    border-radius: 12px;
    background: rgba(15,23,42,.03);
    border: 1px solid rgba(15,23,42,.05);
    text-align: center;
}
.skill-chip .s-emoji { font-size: 22px; }
.skill-chip .s-name { font-size: 12px; font-weight: 700; color: var(--text); margin-top: 4px; }
.skill-chip .s-bar {
    margin-top: 8px; height: 3px; border-radius: 3px;
    background: rgba(15,23,42,.06); overflow: hidden;
}
.skill-chip .s-bar span {
    display: block; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--blue), var(--purple));
}

/* About */
.about-block { margin-bottom: 14px; }
.about-block:last-child { margin-bottom: 0; }
.about-block h4 {
    font-size: 12px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 8px;
}
.about-block p { color: var(--text-dim); }
.edu-row {
    padding: 12px 14px; border-radius: 12px;
    background: rgba(15,23,42,.03); border: 1px solid rgba(15,23,42,.05);
    margin-top: 6px;
}
.edu-row .edu-date { font-size: 11px; color: var(--text-muted); font-family: ui-monospace, monospace; }
.edu-row .edu-title { font-weight: 700; color: var(--text); margin-top: 2px; }
.edu-row .edu-sub { color: var(--blue); font-size: 12.5px; margin-top: 2px; }
.edu-row .edu-desc { font-size: 12.5px; margin-top: 6px; line-height: 1.6; }

/* Contact */
.contact-list { display: flex; flex-direction: column; gap: 8px; }
.contact-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 12px;
    background: rgba(15,23,42,.03); border: 1px solid rgba(15,23,42,.05);
    color: var(--text); text-decoration: none;
    transition: transform .2s, border-color .2s;
}
.contact-row:hover { transform: translateX(4px); border-color: currentColor; }
.contact-row .c-icon { font-size: 18px; }
.contact-row .c-label { font-size: 11px; color: var(--text-muted); }
.contact-row .c-val { font-size: 13px; font-weight: 600; }

/* 节点色系 (用于 modal head) */
.modal[data-node="works"] .modal-title { color: var(--orange); }
.modal[data-node="works"] .modal-title .m-icon { background: var(--orange-soft); color: var(--orange); }
.modal[data-node="skills"] .modal-title { color: var(--blue); }
.modal[data-node="skills"] .modal-title .m-icon { background: var(--blue-soft); color: var(--blue); }
.modal[data-node="about"] .modal-title { color: var(--green); }
.modal[data-node="about"] .modal-title .m-icon { background: var(--green-soft); color: var(--green); }
.modal[data-node="contact"] .modal-title { color: var(--purple); }
.modal[data-node="contact"] .modal-title .m-icon { background: var(--purple-soft); color: var(--purple); }
.modal[data-node="works"] .work-item { color: var(--orange); }
.modal[data-node="skills"] .skill-chip .s-bar span { background: linear-gradient(90deg, var(--blue), var(--purple)); }
.modal[data-node="contact"] .contact-row { color: var(--purple); }

/* 底部签名 */
.foot-signature {
    position: fixed; bottom: 18px; left: 0; right: 0; z-index: 2;
    text-align: center; font-size: 11px; color: var(--text-muted); letter-spacing: .1em;
}

/* ============================================================
   响应式: 移动端改成 2x2 网格布局, 中心核缩小
   ============================================================ */
@media (max-width: 720px) {
    .core { width: 150px; }
    .node-dot { width: 52px; height: 52px; font-size: 20px; }
    .node-label { font-size: 11px; padding: 3px 10px; }
    /* 重新排布节点 —— 2x2 */
    .node--works  { top: 18%; right: 8%; }
    .node--skills { bottom: 18%; right: 8%; }
    .node--about  { bottom: 18%; left: 8%; }
    .node--contact{ top: 18%; left: 8%; }
}
@media (max-width: 480px) {
    .topbar { padding: 14px 16px; }
    .core { width: 130px; }
    .node--works  { top: 14%; right: 6%; }
    .node--skills { bottom: 22%; right: 6%; }
    .node--about  { bottom: 22%; left: 6%; }
    .node--contact{ top: 14%; left: 6%; }
}

/* 无障碍 */
@media (prefers-reduced-motion: reduce) {
    .core::before, .core::after, .corePulse, .orbit-svg circle.pulse { animation: none !important; }
    .node, .node-dot, .node-label, .modal, .work-item, .contact-row { transition: none !important; }
}
</style>
</head>
<body>

<!-- ========= 顶部 ========= -->
<div class="topbar">
    <div class="brand"><span class="core-dot"></span>张宇博</div>
    <div class="status">●  ONLINE</div>
</div>

<!-- ========= 中心枢纽 ========= -->
<div class="stage" id="stage">

    <!-- 连接线 SVG (绘制后注入 4 条线 + 4 个脉冲圆) -->
    <svg class="orbit-svg" id="orbit-svg" xmlns="http://www.w3.org/2000/svg"></svg>

    <!-- 中心核 -->
    <div class="core" id="core" title="品牌核:点击查看简介">
        <div class="c-eyebrow">DIGITAL CREATOR</div>
        <div class="c-name">张宇博</div>
        <div class="c-sub">Wuhan · 2025</div>
    </div>

    <!-- 4 个节点 -->
    <div class="node node--works"   data-node="works">
        <div class="node-dot">📦</div>
        <div class="node-label">作品 WORKS</div>
    </div>
    <div class="node node--skills"  data-node="skills">
        <div class="node-dot">⚡</div>
        <div class="node-label">技术 STACK</div>
    </div>
    <div class="node node--about"   data-node="about">
        <div class="node-dot">👤</div>
        <div class="node-label">关于 ABOUT</div>
    </div>
    <div class="node node--contact" data-node="contact">
        <div class="node-dot">📡</div>
        <div class="node-label">联系 CONTACT</div>
    </div>
</div>

<div class="foot-signature">© 2025 张宇博 · WUT · Built with ❤️</div>

<!-- ========= 弹层 ========= -->
<div class="modal-backdrop" id="modal">
    <div class="modal" id="modal-inner">
        <div class="modal-head">
            <div class="modal-title">
                <span class="m-icon" id="m-icon">📦</span>
                <span id="m-title">标题</span>
            </div>
            <button class="modal-close" id="m-close" aria-label="关闭">✕</button>
        </div>
        <div class="modal-body" id="m-body">内容</div>
    </div>
</div>

<script>
/* ============================================================
   枢纽交互: 连接 SVG + 节点定位 + 弹层内容
   ============================================================ */

/* ---- 1. 画连接线 ---- */
function drawOrbits() {
    const svg = document.getElementById('orbit-svg');
    if (!svg) return;
    const core = document.getElementById('core');
    const coreRect = core.getBoundingClientRect();
    const cx = coreRect.left + coreRect.width / 2;
    const cy = coreRect.top + coreRect.height / 2;

    // 建立 SVG 视口等于整个 viewport
    svg.setAttribute('width', window.innerWidth);
    svg.setAttribute('height', window.innerHeight);
    svg.innerHTML = '';

    const nodes = document.querySelectorAll('.node');
    nodes.forEach((n, i) => {
        const r = n.getBoundingClientRect();
        const nx = r.left + r.width / 2;
        const ny = r.top + r.height / 2;

        // 虚线
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        // 二次贝塞尔, 中间略微弯曲向外
        const mx = (cx + nx) / 2;
        const my = (cy + ny) / 2;
        const dx = nx - cx, dy = ny - cy;
        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        const off = 40; // 弯出去多少
        const bx = mx + (-dy/len) * off;
        const by = my + (dx/len) * off;
        path.setAttribute('d', `M ${cx} ${cy} Q ${bx} ${by} ${nx} ${ny}`);
        svg.appendChild(path);

        // 脉冲圆 —— 沿路径 0..1 循环
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('class', 'pulse');
        circle.setAttribute('r', 3.5);
        circle.setAttribute('cx', cx);
        circle.setAttribute('cy', cy);
        svg.appendChild(circle);

        // 缓存 path 引用, 脉冲圆之后要用到
        circle.dataset.pathD = path.getAttribute('d');
        circle.dataset.progress = (i * 0.25).toFixed(2); // 错开起点
    });
}

/* ---- 2. 脉冲圆沿路径跑 (setInterval 简化版, 够平滑) ---- */
let pulseTick = 0;
function pulseLoop() {
    pulseTick = (pulseTick + 0.008) % 1;
    const circles = document.querySelectorAll('.orbit-svg circle.pulse');
    circles.forEach((c) => {
        const d = c.dataset.pathD;
        if (!d) return;
        // 简易: 用 path API getPointAtLength
        const pathEl = document.querySelector(`.orbit-svg path`); // 拿第一个, 稍后改成对应
        /* 这里简化: 按比例在两端间线性插值 —— 弯曲不影响视觉 */
        // 我们存 path 长度数组太费劲, 换简单办法: 线性插值 + 小抖动
        // 先用 SVGPathElement, 但我们要按 index 区分
    });
}

/* 更简单的脉冲: 只在虚线起点 / 终点闪一下, 不沿路径跑 */
function simplePulse() {
    const paths = document.querySelectorAll('.orbit-svg path');
    const offset = (Date.now() / 50) % 40;
    paths.forEach((p) => {
        p.style.strokeDashoffset = -offset;
    });
}

const modal = document.getElementById('modal');
const modalInner = document.getElementById('modal-inner');
const mIcon = document.getElementById('m-icon');
const mTitle = document.getElementById('m-title');
const mBody = document.getElementById('m-body');

function openModal(key) {
    const c = CONTENTS[key];
    if (!c) return;
    modalInner.dataset.node = key;
    mIcon.textContent = c.icon;
    mTitle.textContent = c.title;
    mBody.innerHTML = c.html;
    modal.classList.add('is-open');
}
function closeModal() {
    modal.classList.remove('is-open');
}

document.querySelectorAll('.node').forEach((n) => {
    n.addEventListener('click', () => openModal(n.dataset.node));
});
document.getElementById('core').addEventListener('click', () => openModal('about'));
document.getElementById('m-close').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ---- 5. 初始化 ---- */
window.addEventListener('load', () => { drawOrbits(); });
window.addEventListener('resize', () => { drawOrbits(); });
window.addEventListener('orientationchange', () => setTimeout(drawOrbits, 200));

/* 首次 300ms 后再画一次, 等待布局稳定 */
setTimeout(drawOrbits, 300);

/* 节流的 drawOrbits */
let _t = 0;
const ro = new ResizeObserver(() => {
    const now = Date.now();
    if (now - _t > 100) { drawOrbits(); _t = now; }
});
document.querySelectorAll('.node, #core').forEach((el) => ro.observe(el));
</script>
